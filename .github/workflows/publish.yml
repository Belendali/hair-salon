name: Publish Panic Salon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Import verified game files on first publication
        run: |
          if [ ! -f docs/index.html ]; then
            python3 scripts/import-game.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs
            git commit -m 'Import verified Panic Salon Demo 35 and local assets'
            git push
          fi
      - name: Validate JavaScript
        run: |
          for file in docs/*.js docs/*.mjs; do node --check "$file"; done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
