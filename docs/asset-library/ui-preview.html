<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panic Salon UI components</title><link rel="stylesheet" href="/hair-salon/style.css?v=37"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#414c45;color:#fff;font:14px system-ui}body{display:block}.examples{display:grid;grid-template-columns:repeat(3,1fr);height:180px;align-items:center;text-align:center}.example{position:relative;height:130px;display:grid;place-items:center}.gesture-hint{position:relative!important;left:auto!important;top:auto!important;transform:none!important;--travel:70px}.gesture-label{font-size:12px}.top-hint,.tip-chip{position:static!important;transform:none!important;width:max-content;margin:8px auto}.top-hint{max-width:100%;font-size:12px}.bar{display:flex;justify-content:center;gap:12px;position:relative;z-index:2;padding:15px}.bar button{border:1px solid #d6ddce;background:#f7f8f1;color:#232821;padding:9px 13px;border-radius:6px;cursor:pointer;font:14px system-ui}.checkout{position:absolute;inset:0;pointer-events:none}.caption{margin:0 10px;text-align:center;font-size:12px;color:#d6e1d1}.patience-dot{display:inline-block}.progress-label{font-size:11px}.tip-chip b{font-size:18px}.tip-chip span{font-size:11px}@media(max-width:560px){.examples{grid-template-columns:1fr 1fr 1.3fr}.top-hint{gap:3px!important;padding:8px!important}.patience{display:none}.progress-label{font-size:9px}.bar button{font-size:12px}.caption{font-size:12px}}</style></head><body><div class="examples"><div class="example"><div id="tap" class="gesture-hint tap"><div class="gesture-motion"><span class="gesture-ring"></span><svg class="gesture-hand" viewBox="0 0 46 56" fill="none">
          <path d="M15 30V9a3.5 3.5 0 0 1 7 0v15c0-5 7-5 7 0v3c0-5 7-5 7 0v3c0-4 7-4 7 0v9c0 7-5 12-12 12h-8c-4 0-6-2-8-6L6 33c-3-4 2-8 5-5l4 4" fill="#fcfcf8" stroke="#25282b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 24v8m7-5v6m7-3v4" stroke="#25282b" stroke-width="1.5" stroke-linecap="round"/>
        </svg><span class="gesture-label">TAP</span></div></div></div><div class="example"><div id="swipe" class="gesture-hint swipe"><div class="gesture-motion"><span class="gesture-ring"></span><svg class="gesture-hand" viewBox="0 0 46 56" fill="none">
          <path d="M15 30V9a3.5 3.5 0 0 1 7 0v15c0-5 7-5 7 0v3c0-5 7-5 7 0v3c0-4 7-4 7 0v9c0 7-5 12-12 12h-8c-4 0-6-2-8-6L6 33c-3-4 2-8 5-5l4 4" fill="#fcfcf8" stroke="#25282b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 24v8m7-5v6m7-3v4" stroke="#25282b" stroke-width="1.5" stroke-linecap="round"/>
        </svg><span class="gesture-label">SWIPE ←</span></div></div></div><div class="example"><div><div class="top-hint"><span class="progress-label">WHITE HAIRS <b>1<i>/3</i></b></span><span class="patience"><i class="patience-dot"></i><i class="patience-dot"></i></span></div><div class="tip-chip"><span>TIP</span><b>$30</b><span>/ $50</span></div></div></div></div><p class="caption">Extracted game components · guides replay for two seconds</p><div class="bar"><button id="replay">Replay guides</button><button id="celebrate">Preview confetti</button></div><div id="celebration" class="checkout win" hidden><div class="checkout-confetti" aria-hidden="true"><i style="--i:0;--x:3%;--drift:-55px"></i><i style="--i:1;--x:40%;--drift:-32px"></i><i style="--i:2;--x:77%;--drift:-9px"></i><i style="--i:3;--x:20%;--drift:14px"></i><i style="--i:4;--x:57%;--drift:37px"></i><i style="--i:5;--x:94%;--drift:-51px"></i><i style="--i:6;--x:37%;--drift:-28px"></i><i style="--i:7;--x:74%;--drift:-5px"></i><i style="--i:8;--x:17%;--drift:18px"></i><i style="--i:9;--x:54%;--drift:41px"></i><i style="--i:10;--x:91%;--drift:-47px"></i><i style="--i:11;--x:34%;--drift:-24px"></i><i style="--i:12;--x:71%;--drift:-1px"></i><i style="--i:13;--x:14%;--drift:22px"></i><i style="--i:14;--x:51%;--drift:45px"></i><i style="--i:15;--x:88%;--drift:-43px"></i><i style="--i:16;--x:31%;--drift:-20px"></i><i style="--i:17;--x:68%;--drift:3px"></i><i style="--i:18;--x:11%;--drift:26px"></i><i style="--i:19;--x:48%;--drift:49px"></i><i style="--i:20;--x:85%;--drift:-39px"></i><i style="--i:21;--x:28%;--drift:-16px"></i><i style="--i:22;--x:65%;--drift:7px"></i><i style="--i:23;--x:8%;--drift:30px"></i><i style="--i:24;--x:45%;--drift:53px"></i><i style="--i:25;--x:82%;--drift:-35px"></i><i style="--i:26;--x:25%;--drift:-12px"></i><i style="--i:27;--x:62%;--drift:11px"></i><i style="--i:28;--x:5%;--drift:34px"></i><i style="--i:29;--x:42%;--drift:-54px"></i></div></div><script>let timer,confettiTimer;function guides(){clearTimeout(timer);for(const id of ['tap','swipe']){const el=document.getElementById(id);el.hidden=false;el.getAnimations({subtree:true}).forEach(a=>{a.currentTime=0;a.play()})}timer=setTimeout(()=>{document.getElementById('tap').hidden=true;document.getElementById('swipe').hidden=true},2000)}document.getElementById('replay').onclick=guides;document.getElementById('celebrate').onclick=()=>{clearTimeout(confettiTimer);const el=document.getElementById('celebration');el.hidden=false;el.getAnimations({subtree:true}).forEach(a=>{a.currentTime=0;a.play()});confettiTimer=setTimeout(()=>el.hidden=true,9000)};guides();</script></body></html>
