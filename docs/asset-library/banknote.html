<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panic Salon — Banknote artwork</title><link rel="icon" href="/hair-salon/favicon.svg"><link rel="stylesheet" href="./library.css?v=1"></head><body><main><header class="top"><a class="brand" href="./">panic salon. / assets</a></header><div class="heading"><div><p class="eyebrow">RUNTIME CANVAS ART</p><h1>Game banknotes.</h1><p class="intro">Original 768 × 336 artwork from payment.mjs. Choose a denomination to download its PNG.</p></div><a href="./files/source/payment.mjs" download class="button">Editable source ↓</a></div><div class="cards" id="notes"></div><p class="section-note">These are fictional salon tips, with the game’s ornamental medallion.</p></main><script type="module">
